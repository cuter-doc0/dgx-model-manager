# DGX Spark Model Manager - Docker Compose Stack
# All engines defined here. Enable via COMPOSE_PROFILES in .env
# Example: COMPOSE_PROFILES=manager,ollama,vllm,sglang

services:
  # ============================================
  # Model Manager - Main Control Panel
  # ============================================
  manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgx-model-manager
    restart: unless-stopped
    group_add:
      - "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${MANAGER_PORT:-4600}:4600"
    volumes:
      - ${MODELS_PATH:-./models}:/models
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app/project              # Compose project files
      - ./config:/app/config
      - ./engines:/app/engines
      - ./app:/app/app              # Live code reload
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTHONDONTWRITEBYTECODE=1
      - COMPOSE_PROJECT_NAME=dgx-spark
    networks:
      - model-network

  # ============================================
  # Ollama - GGUF Model Manager
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: dgx-ollama
    restart: unless-stopped
    profiles: [ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${OLLAMA_PORT:-4610}:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${MODELS_PATH:-./models}:/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - model-network

  # ============================================
  # LiteLLM - Unified API Router
  # ============================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: dgx-litellm
    restart: unless-stopped
    profiles: [litellm]
    ports:
      - "${LITELLM_PORT:-4601}:4000"
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      - LITELLM_LOG=INFO
    networks:
      - model-network

  # ============================================
  # vLLM - High-Performance Inference
  # ============================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: dgx-vllm
    profiles: [vllm]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${VLLM_PORT:-4630}:8000"
    volumes:
      - ${MODELS_PATH:-./models}:/models
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
    networks:
      - model-network

  # ============================================
  # SGLang - High-Performance Inference
  # ============================================
  sglang:
    image: lmsysorg/sglang:latest
    container_name: dgx-sglang
    profiles: [sglang]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${SGLANG_PORT:-4620}:30000"
    volumes:
      - ${MODELS_PATH:-./models}:/models
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
    networks:
      - model-network

  # ============================================
  # llama.cpp - GGUF Model Server
  # ============================================
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: dgx-llamacpp
    profiles: [llamacpp]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${LLAMACPP_PORT:-4640}:8080"
    volumes:
      - ${MODELS_PATH:-./models}:/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - model-network

volumes:
  ollama-data:

networks:
  model-network:
    driver: bridge
